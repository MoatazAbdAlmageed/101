    <script type="text/markdown" id="markdown-content">
### Phase 1: **Getting Started**

#### Introduction to Express
Express is a minimal and flexible Node.js web application framework that provides a robust set of features for web and mobile applications.

#### Installation & Setup
```bash
npm install express
```

#### Hello World
```javascript
const express = require('express');
const app = express();
const port = 3000;

app.get('/', (req, res) => {
  res.send('Hello World!');
});

app.listen(port, () => {
  console.log(`Example app listening on port ${port}`);
});
```

#### The Request Object
The `req` object represents the HTTP request and has properties for the request query string, parameters, body, HTTP headers, and so on.

#### The Response Object
The `res` object represents the HTTP response that an Express app sends when it gets an HTTP request.

### Phase 2: **Routing**

#### Basic Routing
Routing refers to determining how an application responds to a client request to a particular endpoint.

```javascript
app.get('/', (req, res) => { ... });
app.post('/', (req, res) => { ... });
app.put('/user', (req, res) => { ... });
app.delete('/user', (req, res) => { ... });
```

#### Route Parameters
Route parameters are named URL segments that are used to capture the values specified at their position in the URL.

```javascript
app.get('/users/:userId/books/:bookId', (req, res) => {
  res.send(req.params);
});
```

#### Route Handlers
You can provide multiple callback functions that behave like middleware to handle a request.

#### Response Methods
Methods like `res.download()`, `res.end()`, `res.json()`, `res.redirect()`, `res.render()`, and `res.send()`.

#### app.route()
You can create chainable route handlers for a route path by using `app.route()`.

### Phase 3: **Middleware**

#### What is Middleware?
Middleware functions are functions that have access to the request object, the response object, and the next middleware function in the application’s request-response cycle.

#### Application-level Middleware
Bind application-level middleware to an instance of the app object by using the `app.use()` and `app.METHOD()` functions.

#### Router-level Middleware
Router-level middleware works in the same way as application-level middleware, except it is bound to an instance of `express.Router()`.

#### Error-handling Middleware
Define error-handling middleware functions in the same way as other middleware functions, except error-handling functions have four arguments instead of three: `(err, req, res, next)`.

#### Built-in Middleware
Express has the following built-in middleware functions:
- `express.static` serves static assets such as HTML files, images, and so on.
- `express.json` parses incoming requests with JSON payloads.
- `express.urlencoded` parses incoming requests with URL-encoded payloads.

### Phase 4: **Templating & Static Files**

#### Serving Static Files
To serve static files such as images, CSS files, and JavaScript files, use the `express.static` built-in middleware function in Express.

```javascript
app.use(express.static('public'));
```

#### Template Engines
A template engine enables you to use static template files in your application. At runtime, the template engine replaces variables in a template file with actual values.

#### Using Pug with Express
How to set up and use the Pug template engine.

#### Using EJS with Express
How to set up and use the EJS template engine.

#### Consolidate.js
Using multiple template engines with Consolidate.js.

### Phase 5: **Advanced Topics**

#### Database Integration
Connecting Express to databases like MongoDB, MySQL, and PostgreSQL.

#### Authentication & Authorization
Implementing user login and access control using Passport.js or JWT.

#### Security Best Practices
Using Helmet to set security headers and implementing rate limiting.

#### Testing Express Apps
Writing unit and integration tests for your Express routes using Mocha, Chai, and Supertest.

#### Task Manager App (Hands-on)

You can find it in the `./task-manager` directory.

To run it:
1. Navigate to the folder: `cd task-manager`
2. Install dependencies: `npm install`
3. Start the app: `node app.js`
4. Visit: `http://localhost:3000`

    <script>
        async function initConverter() {
            try {
                const markdown = document.getElementById('markdown-content').textContent;
                const phases = parseMarkdownToPhases(markdown);
                renderBook(phases);
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('book-content').style.display = 'block';
                document.querySelector('.page-nav').style.display = 'flex';
                
                const hash = window.location.hash.substring(1);
                if (hash) showPage(hash); else showPage('p1-1');
            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerHTML = `<p style="color: var(--primary)">Error loading content.</p>`;
            }
        }

        function parseMarkdownToPhases(md) {
            const phaseBlocks = md.split(/### Phase \d:/g).filter(b => b.trim().length > 10);
            return phaseBlocks.map((content, index) => {
                const phaseNum = index + 1;
                const sections = content.split('#### ').filter(s => s.trim().length > 0);
                const titleLine = content.split('\n')[0].trim();
                const title = titleLine.replace(/^\*\*|\*\*$/g, '') || `Phase ${phaseNum}`;
                
                const pages = sections.map((section, i) => {
                    const lines = section.split('\n');
                    return {
                        id: `p${phaseNum}-${i+1}`,
                        title: lines[0].trim(),
                        content: marked.parse(lines.slice(1).join('\n'))
                    };
                });
                
                return { id: phaseNum, title, pages };
            });
        }

        function renderBook(phases) {
            const container = document.getElementById('book-content');
            const nav = document.querySelector('.nav-content');
            nav.innerHTML = ''; container.innerHTML = '';

            phases.forEach(phase => {
                const chapterDiv = document.createElement('div');
                chapterDiv.className = 'chapter';
                chapterDiv.innerHTML = `<div class="chapter-title">Phase ${phase.id}: ${phase.title}</div>`;
                
                phase.pages.forEach(page => {
                    const link = document.createElement('a');
                    link.href = `#${page.id}`;
                    link.className = 'page-link';
                    link.dataset.page = page.id;
                    link.textContent = page.title;
                    chapterDiv.appendChild(link);

                    const pageSection = document.createElement('section');
                    pageSection.id = page.id;
                    pageSection.className = 'book-page';
                    pageSection.innerHTML = `
                        <div class="content-header">
                            <span class="label">Phase ${phase.id} • Chapter ${page.id.split('-')[1]}</span>
                            <h1>${page.title}</h1>
                        </div>
                        <div class="content-body">${page.content}</div>
                    `;
                    container.appendChild(pageSection);
                });
                nav.appendChild(chapterDiv);
            });
        }

        function showPage(pageId) {
            const pages = document.querySelectorAll('.book-page');
            const navLinks = document.querySelectorAll('.page-link');
            pages.forEach(p => p.classList.remove('active'));
            navLinks.forEach(l => l.classList.remove('active'));
            
            const target = document.getElementById(pageId);
            const link = document.querySelector(`[data-page="${pageId}"]`);
            if (target) {
                target.classList.add('active');
                if (link) link.classList.add('active');
                updateNavButtons(pageId);
                document.getElementById('content-viewer').scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function updateNavButtons(currentId) {
            const allLinks = Array.from(document.querySelectorAll('.page-link'));
            const currentLink = document.querySelector(`[data-page="${currentId}"]`);
            const currentIndex = allLinks.indexOf(currentLink);
            const nextBtn = document.querySelector('.next');
            const prevBtn = document.querySelector('.prev');

            if (currentIndex > 0) {
                prevBtn.style.visibility = 'visible';
                prevBtn.href = `#${allLinks[currentIndex - 1].dataset.page}`;
                prevBtn.querySelector('.title').textContent = allLinks[currentIndex - 1].textContent;
            } else prevBtn.style.visibility = 'hidden';

            if (currentIndex < allLinks.length - 1 && currentIndex !== -1) {
                nextBtn.style.visibility = 'visible';
                nextBtn.href = `#${allLinks[currentIndex + 1].dataset.page}`;
                nextBtn.querySelector('.title').textContent = allLinks[currentIndex + 1].textContent;
            } else nextBtn.style.visibility = 'hidden';
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            if (hash) showPage(hash);
        });

        window.addEventListener('DOMContentLoaded', initConverter);
    </script>
