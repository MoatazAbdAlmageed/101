### Phase 1: **Architecture & Core Fundamentals**

#### Node.js Architecture Deep Dive
Node.js is not a language or a framework; it's a **runtime environment** that allows you to execute JavaScript on the server.

- **V8 Engine**: Developed by Google for Chrome, it compiles JavaScript directly into native machine code before executing it.
- **Libuv**: A multi-platform C library that provides support for asynchronous I/O based on event loops. It handles the thread pool, file system events, and DNS operations.
- **Single-Threaded Event Loop**: While the Event Loop itself is single-threaded, Node.js offloads heavy tasks (like File I/O or Cryptography) to the **Libuv Thread Pool** (usually 4 threads by default), making it highly scalable.

#### The Module System (CJS vs ESM)
Node.js supports two distinct module systems. Understanding the difference is crucial for modern development.

**1. CommonJS (CJS)** - The legacy standard:
- Uses `require()` and `module.exports`.
- Synchronous loading.
- Ideal for older Node versions and some server-side tools.

```javascript
// math.js
const add = (a, b) => a + b;
module.exports = { add };

// app.js
const { add } = require('./math.js');
console.log(add(5, 10));
```

**2. ECMAScript Modules (ESM)** - The modern standard:
- Uses `import` and `export`.
- Asynchronous loading.
- Supported natively in Node 12+ (use `.mjs` or `"type": "module"` in `package.json`).

```javascript
// math.mjs
export const multiply = (a, b) => a * b;

// app.mjs
import { multiply } from './math.mjs';
```

#### NPM: Beyond the Basics
NPM is more than just a downloader; it's a dependency manager.
- **package.json**: The heart of your project. Defines versions using SemVer (`^` for minor, `~` for patch).
- **package-lock.json**: Ensures every developer on the team installs the exact same versions.
- **npx**: Execute packages without installing them globally (e.g., `npx create-react-app`).

#### File System (fs) - Three Ways to Code
The `fs` module is for interacting with files. You should almost always prefer the Promises API.

```javascript
const fs = require('fs/promises');

// 1. Promises (Modern & Recommended)
async function handleFile() {
    try {
        await fs.writeFile('log.txt', 'Hello Node!');
        const data = await fs.readFile('log.txt', 'utf8');
        console.log(data);
    } catch (err) {
        console.error(err);
    }
}

// 2. Callbacks (Legacy - leads to nesting)
const fsLegacy = require('fs');
fsLegacy.readFile('test.txt', 'utf8', (err, data) => { ... });

// 3. Sync (Blocking - AVOID in web servers)
const data = fsLegacy.readFileSync('test.txt', 'utf8');
```

#### Streams: Processing Data in Chunks
Streams are the most efficient way to handle large data (GBs of video or logs) without hitting memory limits.

- **Readable**: Reading from a source (e.g., `fs.createReadStream`).
- **Writable**: Writing to a destination (e.g., `fs.createWriteStream`).
- **Duplex**: Both readable and writable (e.g., TCP Sockets).
- **Transform**: Modifies data as it's read/written (e.g., `zlib` for compression).

```javascript
const fs = require('fs');
const zlib = require('zlib');

// Compressing a file using Pipes
fs.createReadStream('large_file.txt')
  .pipe(zlib.createGzip())
  .pipe(fs.createWriteStream('large_file.txt.gz'));
```

### Phase 2: **High-Performance Web Servers**

#### The HTTP Core Module
Understanding the low-level `http` module helps you appreciate what Express does behind the scenes.

```javascript
const http = require('http');

const server = http.createServer((req, res) => {
    // req: Information about the request (URL, Method, Headers)
    // res: Object used to send data back to the client
    
    if (req.url === '/') {
        res.writeHead(200, { 'Content-Type': 'text/html' });
        res.end('<h1>Welcome Home</h1>');
    } else if (req.url === '/api/data') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({ message: 'Success' }));
    }
});

server.listen(3000, () => console.log('Server live on 3000'));
```

#### Express.js: The Industry Standard
Express is a minimalist web framework that organizes your server into routes and middleware.

```javascript
const express = require('express');
const app = express();

// Global Middleware to parse JSON
app.use(express.json());

app.get('/user/:id', (req, res) => {
    const userId = req.params.id; // From URL path
    const query = req.query.sort; // From URL ?sort=asc
    res.status(200).send(`User ${userId} sorted by ${query}`);
});
```

#### The Power of Middleware
Middleware functions sit between the request and the final route handler. They can:
1. Execute any code.
2. Make changes to the request and response objects.
3. End the request-response cycle.
4. Call the next middleware in the stack using `next()`.

```javascript
// Custom Logging Middleware
const logger = (req, res, next) => {
    console.log(`${new Date().toISOString()} - ${req.method} ${req.url}`);
    next(); // CRITICAL: Without this, the request hangs forever!
};

app.use(logger);
```

#### Error Handling Strategy
Express has a special middleware for errors. It must be defined **last**, after all routes.

```javascript
app.use((err, req, res, next) => {
    console.error(err.stack);
    res.status(500).json({
        error: 'Internal Server Error',
        message: err.message
    });
});
```

### Phase 3: **Asynchronous Mastery**

#### The Event Loop Phases
To truly master Node.js, you must understand the Event Loop phases:
1. **Timers**: `setTimeout()` and `setInterval()`.
2. **Pending Callbacks**: I/O callbacks deferred from previous cycles.
3. **Idle, Prepare**: Used only internally.
4. **Poll**: Retrieve new I/O events (where most code executes).
5. **Check**: `setImmediate()`.
6. **Close Callbacks**: `socket.on('close', ...)`.

> **Pro Tip**: `process.nextTick()` is NOT part of the event loop. It executes immediately after the current operation, before the next phase.

#### Promises & Async/Await Pattern
Always wrap your async code in `try/catch` to prevent server crashes from unhandled rejections.

```javascript
const fetchData = async () => {
    try {
        const result = await someDatabaseCall();
        return result;
    } catch (error) {
        // Handle database specific errors
        throw new Error('Database connection failed');
    }
};
```

#### Event Emitters: Custom Events
Node.js follows an observer pattern using the `events` module.

```javascript
const EventEmitter = require('events');
const chatRoom = new EventEmitter();

// Subscriber
chatRoom.on('message', (user, msg) => {
    console.log(`[${user}]: ${msg}`);
});

// Publisher
chatRoom.emit('message', 'Alice', 'Hello everyone!');
```

### Phase 4: **Data Persistence**

#### SQL vs NoSQL in Node.js
- **SQL (MySQL/PostgreSQL)**: Great for structured data with complex relationships. Use **Prisma** or **Sequelize**.
- **NoSQL (MongoDB)**: Flexible, JSON-like document storage. Use **Mongoose**.

#### Mongoose & Data Modeling
Modeling data ensures consistency.

```javascript
const mongoose = require('mongoose');

const userSchema = new mongoose.Schema({
    username: { type: String, required: true, unique: true },
    email: { type: String, lowercase: true },
    age: { type: Number, min: 18 },
    createdAt: { type: Date, default: Date.now }
});

const User = mongoose.model('User', userSchema);
```

#### Database Best Practices
1. **Connection Pooling**: Don't open/close connections for every request.
2. **Indexing**: Essential for performance on large collections.
3. **Validation**: Validate data at the application level (Zod) and DB level (Mongoose).
4. **Sanitization**: Prevent SQL/NoSQL Injection by using ORMs/ODMs.

### Phase 5: **Production & Beyond**

#### Security Best Practices
Security is not a feature; it's a foundation.
- **Helmet**: Sets various HTTP headers to secure your app.
- **Express-Rate-Limit**: Prevents Brute-Force and DoS attacks.
- **Dotenv**: Keep your secrets (API keys, DB URLs) out of your code.
- **Bcrypt**: Always hash passwords. Never store plain text!

#### Performance & Scaling
- **Clustering**: Use the `cluster` module to spawn multiple instances of your app to utilize all CPU cores.
- **PM2**: A production process manager that handles auto-restarts and load balancing.
- **Redis Caching**: Store expensive query results in-memory for lightning-fast retrieval.

#### Real-time with WebSockets
`Socket.io` enables bi-directional, real-time communication between the client and the server. Ideal for chats, live notifications, and gaming.

```javascript
const { Server } = require('socket.io');
const io = new Server(server);

io.on('connection', (socket) => {
    console.log('A user connected');
    socket.on('chat message', (msg) => {
        io.emit('chat message', msg); // Broadcast to all connected clients
    });
});
```

    <script>
        /**
         * Node.js Book Converter Engine
         * Automatically transforms structured Markdown into an interactive book.
         */
        
        async function initConverter() {
            try {
                // Get markdown from embedded script tag instead of fetching
                const markdown = document.getElementById('markdown-content').textContent;
                
                const phases = parseMarkdownToPhases(markdown);
                renderBook(phases);
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('book-content').style.display = 'block';
                document.querySelector('.page-nav').style.display = 'flex';
                
                // Handle URL hash for deep linking
                const hash = window.location.hash.substring(1);
                if (hash) {
                    showPage(hash);
                } else {
                    showPage('p1-1');
                }
            } catch (err) {
                console.error('Failed to load content.md', err);
                document.getElementById('loader').innerHTML = `<p style="color: var(--primary)">Error: content.md not found. Please ensure it exists in the root directory.</p>`;
            }
        }

        function parseMarkdownToPhases(md) {
            // Split by "### Phase X"
            const phaseBlocks = md.split(/### Phase \d:/g).filter(b => b.trim().length > 10);
            
            return phaseBlocks.map((content, index) => {
                const phaseNum = index + 1;
                const lines = content.split('\n').filter(l => l.trim() !== '');
                const titleLine = lines[0].trim();
                const title = titleLine.replace(/^\*\*|\*\*$/g, '') || `Phase ${phaseNum}`;
                
                // Divide lines into 5 chunks (or adjust based on content)
                const pages = [];
                const sections = content.split('#### ').filter(s => s.trim().length > 0);
                
                if (sections.length > 1) {
                    // Use #### headers as pages if they exist
                    sections.forEach((section, i) => {
                        const sectionLines = section.split('\n');
                        const sectionTitle = sectionLines[0].trim();
                        const sectionContent = sectionLines.slice(1).join('\n');
                        pages.push({
                            id: `p${phaseNum}-${i+1}`,
                            title: sectionTitle,
                            content: marked.parse(sectionContent)
                        });
                    });
                } else {
                    // Fallback: divide into 5 chunks
                    const chunkSize = Math.ceil(lines.length / 5);
                    for (let i = 0; i < 5; i++) {
                        const start = i * chunkSize;
                        const end = start + chunkSize;
                        const pageContent = lines.slice(start, end).join('\n');
                        if (pageContent.trim().length === 0) continue;
                        
                        pages.push({
                            id: `p${phaseNum}-${i+1}`,
                            title: `Step ${i+1}: Deep Dive`,
                            content: marked.parse(pageContent)
                        });
                    }
                }
                
                return {
                    id: phaseNum,
                    title: title,
                    pages: pages
                };
            });
        }

        function renderBook(phases) {
            const container = document.getElementById('book-content');
            const nav = document.querySelector('.nav-content');
            
            nav.innerHTML = ''; // Clear static nav
            container.innerHTML = ''; // Clear static content

            phases.forEach(phase => {
                // Render Sidebar Chapter
                const chapterDiv = document.createElement('div');
                chapterDiv.className = 'chapter';
                chapterDiv.innerHTML = `<div class="chapter-title">Phase ${phase.id}: ${phase.title}</div>`;
                
                phase.pages.forEach(page => {
                    // Add Nav Link
                    const link = document.createElement('a');
                    link.href = `#${page.id}`;
                    link.className = 'page-link';
                    link.dataset.page = page.id;
                    link.textContent = page.title;
                    link.onclick = (e) => { 
                        // Let hashChange handle it
                    };
                    chapterDiv.appendChild(link);

                    // Add Page Content
                    const pageSection = document.createElement('section');
                    pageSection.id = page.id;
                    pageSection.className = 'book-page';
                    pageSection.innerHTML = `
                        <div class="content-header">
                            <span class="label">Phase ${phase.id} • Chapter ${page.id.split('-')[1]}</span>
                            <h1>${page.title}</h1>
                        </div>
                        <div class="content-body">
                            ${page.content}
                        </div>
                    `;
                    container.appendChild(pageSection);
                });
                
                nav.appendChild(chapterDiv);
            });
        }

        function showPage(pageId) {
            const pages = document.querySelectorAll('.book-page');
            const navLinks = document.querySelectorAll('.page-link');
            
            pages.forEach(p => p.classList.remove('active'));
            navLinks.forEach(l => l.classList.remove('active'));
            
            const target = document.getElementById(pageId);
            const link = document.querySelector(`[data-page="${pageId}"]`);
            
            if (target) {
                target.classList.add('active');
                if (link) link.classList.add('active');
                updateNavButtons(pageId);
                document.getElementById('content-viewer').scrollTo({ top: 0, behavior: 'smooth' });
            } else if (pages.length > 0) {
                // Fallback to first page
                const firstId = pages[0].id;
                pages[0].classList.add('active');
                if (navLinks[0]) navLinks[0].classList.add('active');
                updateNavButtons(firstId);
            }
        }

        function updateNavButtons(currentId) {
            const allLinks = Array.from(document.querySelectorAll('.page-link'));
            const currentLink = document.querySelector(`[data-page="${currentId}"]`);
            const currentIndex = allLinks.indexOf(currentLink);
            
            const nextBtn = document.querySelector('.next');
            const prevBtn = document.querySelector('.prev');

            if (currentIndex > 0) {
                prevBtn.style.visibility = 'visible';
                prevBtn.href = `#${allLinks[currentIndex - 1].dataset.page}`;
                prevBtn.querySelector('.title').textContent = allLinks[currentIndex - 1].textContent;
            } else {
                prevBtn.style.visibility = 'hidden';
            }

            if (currentIndex < allLinks.length - 1 && currentIndex !== -1) {
                nextBtn.style.visibility = 'visible';
                nextBtn.href = `#${allLinks[currentIndex + 1].dataset.page}`;
                nextBtn.querySelector('.title').textContent = allLinks[currentIndex + 1].textContent;
            } else {
                nextBtn.style.visibility = 'hidden';
            }
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            if (hash) showPage(hash);
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initConverter);
    </script>
