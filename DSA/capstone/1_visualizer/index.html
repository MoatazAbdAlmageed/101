<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualizer | DSA Master Class</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Algorithm Visualizer</h1>
        <p class="subtitle">Witness the power of Data Structures and Algorithms in real-time.</p>
    </header>

    <div class="controls">
        <div class="control-group">
            <label>Algorithm</label>
            <select id="algo-select">
                <option value="bubble">Bubble Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="insertion">Insertion Sort</option>
                <option value="quick">Quick Sort</option>
                <option value="merge">Merge Sort</option>
            </select>
        </div>

        <div class="control-group">
            <label>Array Size</label>
            <input type="range" id="size-slider" min="10" max="100" value="50">
        </div>

        <div class="control-group">
            <label>Speed</label>
            <input type="range" id="speed-slider" min="1" max="100" value="50">
        </div>

        <div class="control-group" style="flex-direction: row; align-items: flex-end; gap: 1rem;">
            <button id="reset-btn">New Array</button>
            <button id="start-btn">Start Sorting</button>
        </div>
    </div>

    <div class="visualizer-container" id="visualizer">
        <!-- Bars will be generated here -->
    </div>

    <div class="stats">
        <span>Comparisons: <b id="comp-count">0</b></span>
        <span>Swaps: <b id="swap-count">0</b></span>
        <span>Time Complexity: <b id="time-complexity">O(N²)</b></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
